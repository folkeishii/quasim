[workspace]
members = [
  "examples/*",
  "quasim",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
crossterm = "0.29.0"
array-init = "2.1.0"
divan = "0.1.21"
nalgebra = "0.34.1"
rand = "0.9.2"
thiserror = "2.0.18"
oq3_syntax = "0.7.0"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }