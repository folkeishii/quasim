[package]
name = "quasim"
version = "0.1.0"
edition = "2024"

[features]
default = []
gpu = ["dep:cubecl"]
wgpu = ["gpu", "cubecl/wgpu"]
cuda = ["gpu", "cubecl/cuda"]
cpu = ["gpu", "cubecl/cpu"]
hip = ["gpu", "cubecl/hip"]

[dependencies]
crossterm = "0.29.0"
array-init = "2.1.0"
divan = "0.1.21"
nalgebra.workspace = true
rand = "0.9.2"
thiserror = "2.0.18"
oq3_syntax = "0.7.0"
log.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
rayon = "1.11.0"
cubecl = { version = "=0.10.0-pre.3", features = ["wgpu", "cuda"], optional = true }

[dev-dependencies]
tracking-allocator = "0.4.0"
bench_utils = { path = "../bench_utils" }

[[bench]]
name = "qft"
harness = false

[[bench]]
name = "system-size"
harness = false

[[bench]]
name = "mid-measure-all"
harness = false

[[bench]]
name = "mid-measurements"
harness = false

[[bench]]
name = "num-gates"
harness = false

[[bench]]
name = "system-size-entanglement"
harness = false
